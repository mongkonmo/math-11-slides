/* 2) SHELL BLOCK — edge handle + slide-out drawer (the instructor-approved
   design). No persistent header. A slim labeled tab ("Index") stays attached
   to the left edge of the viewport, vertically centered; it slides out with
   the drawer and its label flips to "Close". Over a loaded deck the drawer
   is a modal dialog (scrim, focus trap, Esc); on the bare URL it is simply
   open, non-modal, with a welcome card beside it.
   The page-level dark-mode toggle sits fixed in the top-right corner — one
   control for the ENTIRE page: shell chrome, drawer, and the loaded deck
   (the shell posts the theme into the iframe; see the script). It has an
   opaque button background so it stays readable over any deck content.
   Presentation mode: the deck fills the whole viewport; the handle sits on
   the iframe's left edge (riding the letterbox gutter beside the 16:9 stage
   on wide screens) and the toggle sits over the deck toolbar's right end —
   in NON-fullscreen presentation the toggle covers the deck's slide counter
   (the counter is right-aligned in the toolbar, directly beneath the
   toggle); that is this design's trade-off. OS or browser fullscreen (the
   deck's iframe going fullscreen) covers ALL shell chrome — handle and
   toggle — entirely, so a real presentation sees the full counter and no
   shell chrome; leaving fullscreen restores both controls. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: light dark; height: 100%; }
body {
  margin: 0; height: 100%;
  font-family: var(--font-body);
  background: var(--bg-page);
  color: var(--text-primary);
  line-height: 1.55;
  overflow: hidden;
}
#viewer { position: fixed; inset: 0; background: var(--bg-page); }
#viewer iframe { display: block; width: 100%; height: 100%; border: 0; }
#welcome { position: fixed; inset: 0; overflow: auto; padding: 3.5rem 1rem 1.5rem; }
.welcome-card {
  max-width: 26rem; margin: 0 auto;
  background: var(--bg-slide);
  border: 1px solid var(--card-border, var(--rule));
  border-radius: var(--card-radius, 14px);
  box-shadow: var(--shadow-card);
  padding: 1.5rem 1.75rem;
}
.welcome-card h1 {
  font-family: var(--font-display); font-weight: 900;
  color: var(--heading); font-size: 1.45rem; line-height: 1.2;
  margin: 0 0 0.75rem;
}
.welcome-card h1:focus { outline: none; } /* focus target after Back; focus-visible ring below still applies */
.welcome-card h1::after {
  content: ""; display: block; width: 3.25rem; height: 0.3rem;
  margin-top: 0.5rem; background: var(--accent, var(--heading));
  border-radius: 999px;
}
.welcome-card p { margin: 0.6rem 0 0; font-size: 0.95rem; }
/* On wide screens, keep the welcome card clear of the open drawer. */
@media (min-width: 800px) {
  body.drawer-open #welcome { padding-left: calc(min(19rem, 100vw - 3.25rem) + 3rem); }
}
#scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 30; }
#drawer {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: min(19rem, calc(100vw - 3.25rem)); /* the handle stays visible even at 320px */
  background: var(--bg-slide);
  border-right: 1px solid var(--card-border, var(--rule));
  box-shadow: var(--shadow-card);
  z-index: 40;
  overflow-y: auto; overflow-x: hidden;
  padding: 0 0 1rem;
  transform: translateX(-102%);
  visibility: hidden; /* keeps the closed drawer's links out of the tab order */
  transition: transform 160ms ease, visibility 0s 160ms;
}
body.drawer-open #drawer { transform: none; visibility: visible; transition: transform 160ms ease; }
#drawer:focus { outline: none; } /* focus target on open; inner controls keep rings */
.drawer-head {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  padding: 0.6rem 1rem;
  background: var(--bg-chrome);
  border-bottom: 1px solid var(--card-border, var(--rule));
}
/* At narrow widths the fixed top-right theme toggle crosses into the
   drawer's top strip; reserve room so it never covers the drawer title. */
@media (max-width: 430px) {
  .drawer-head { padding-right: 3.25rem; }
}
.drawer-title {
  flex: 1 1 auto; min-width: 0;
  font-family: var(--font-display); font-weight: 900;
  font-size: 0.95rem; color: var(--heading);
}
button {
  font: inherit; font-size: 0.86rem; font-weight: 600;
  color: var(--btn-text); background: var(--btn-bg);
  border: 1px solid var(--btn-border); border-radius: 999px;
  padding: 0.32rem 0.95rem; cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease;
}
button:hover { background: var(--btn-bg-hover); }
button:active { transform: translateY(1px); }
/* The edge handle: a labeled tab, keyboard reachable, riding the drawer
   edge. Kept slim (small type, tight padding) so at common widths it sits
   over the deck's page gutter and the slide card's left padding — never
   over slide text (reading-mode text starts no closer than ~36px from the
   left edge even at 320px; the handle is ~26px wide). */
#handle {
  position: fixed; left: 0; top: 50%; z-index: 41;
  transform: translateY(-50%);
  writing-mode: vertical-rl;
  font-size: 0.8rem;
  padding: 0.75rem 0.34rem;
  border-radius: 0 12px 12px 0;
  border-left: none;
  font-weight: 700; letter-spacing: 0.06em;
  box-shadow: var(--shadow-card);
  transition: left 160ms ease;
}
body.drawer-open #handle { left: min(19rem, calc(100vw - 3.25rem)); }
/* Page-level dark-mode toggle: fixed top-right, always visible (like the
   handle), a sun/moon ICON button with aria-pressed state (accessible name
   on the button; the SVG is decorative). Opaque --btn-bg keeps it readable
   over deck content. Rides above the scrim (like the handle) so the theme
   stays reachable while the drawer is modal; the focus trap includes it.
   Sized 2rem (32px) square — a comfortable touch target that reads as
   sitting IN the deck's ~3.25rem (52px) toolbar band: top is set so the
   button is vertically centered in that band when a deck is loaded, and
   the same offset keeps it sensibly top-right in the index state. */
#btn-themeflip {
  position: fixed; top: 0.625rem; right: 1rem; z-index: 41;
  display: inline-flex; align-items: center; justify-content: center;
  width: 2rem; height: 2rem; padding: 0;
  box-shadow: var(--shadow-card);
}
#btn-themeflip svg { width: 1rem; height: 1rem; }
/* Show the moon in light mode (activating switches to dark) and the sun in
   dark mode (activating switches to light) — the icon depicts the mode you
   switch TO. Icon color is currentColor (= --btn-text on --btn-bg, the
   already-vetted pill pair, which clears the 3:1 non-text floor). */
.icon-sun { display: none; }
.icon-moon { display: block; }
html[data-theme="dark"] .icon-sun { display: block; }
html[data-theme="dark"] .icon-moon { display: none; }
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) .icon-sun { display: block; }
  html:not([data-theme="light"]) .icon-moon { display: none; }
}
/* Compact index content: plain small-caps chapter headings (nothing to
   collapse — the drawer itself is the show/hide), one-line deck rows. */
.chap-label {
  margin: 0.9rem 0 0.15rem;
  padding: 0 1rem;
  font-family: var(--font-body);
  font-size: 0.78rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-secondary);
}
.deck-list { list-style: none; margin: 0; padding: 0; }
.deck-list a {
  display: block;
  padding: 0.4rem 1rem 0.4rem 1.3rem;
  color: var(--link); font-weight: 600; font-size: 0.95rem;
  text-decoration: none;
  border-left: 4px solid transparent;
}
.deck-list a:hover { background: var(--btn-bg-hover); text-decoration: underline; }
.deck-list a[aria-current="page"] {
  border-left-color: var(--accent, var(--heading));
  background: var(--accent-soft);
}
:is(a, summary, button, [tabindex]):focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}
#drawer a:focus-visible { outline-offset: -3px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body class="drawer-open">
<!-- The handle comes FIRST in the DOM: from a loaded deck, one Shift+Tab
     lands on it, and keyboard users entering the page meet it immediately;
     the theme toggle is the very next tab stop. -->
<button type="button" id="handle" aria-expanded="true" aria-controls="drawer">Index</button>
<button type="button" id="btn-themeflip" aria-pressed="false" aria-label="Dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M20.6 14.5A8.6 8.6 0 0 1 9.5 3.4 9 9 0 1 0 20.6 14.5Z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.4" fill="currentColor" stroke="none"/><path d="M12 2.2v2.6M12 19.2v2.6M2.2 12h2.6M19.2 12h2.6M5.1 5.1l1.8 1.8M17.1 17.1l1.8 1.8M18.9 5.1l-1.8 1.8M6.9 17.1l-1.8 1.8"/></svg>
</button>
<div id="welcome">
  <div class="welcome-card">
    <h1 id="shell-title" tabindex="-1">Math 11 Slide Decks</h1>
    <p>Choose a deck from the index. The deck opens right here, and the Index tab on the left edge of the screen brings the list back at any time.</p>
  </div>
</div>
<div id="viewer" hidden></div>
<div id="scrim" hidden></div>
<div id="drawer" tabindex="-1" aria-label="Deck index">
  <div class="drawer-head">
    <span class="drawer-title">Math 11 Slide Decks</span>
  </div>
  <nav aria-label="Deck index">
    <h2 class="chap-label">Chapter 0</h2>
    <ul class="deck-list">
      <li><a href="00-00-welcome-fall-2026.html" data-slug="00-00-welcome-fall-2026" data-title="Math 11 Day 1 — Welcome to Fall 2026">Day 1 — Welcome to Fall 2026</a></li>
    </ul>
    <h2 class="chap-label">Chapter 1</h2>
    <ul class="deck-list">
      <li><a href="01-01-what-is-statistics.html" data-slug="01-01-what-is-statistics" data-title="Math 11 §1.1 — What is Statistics?">§1.1 What is Statistics?</a></li>
    </ul>
  </nav>
</div>
<script>
(function () {
  'use strict';
  /* === Shell controller ===
     Hash routing: index.html#<deck-basename> selects a deck; the bare URL
     is the index state. Back/forward walk the history; refresh keeps the
     selection; an unknown hash falls back to the index (no error page).
     The shell never reaches into the frame's DOM — it only sets iframe.src
     and posts the theme via postMessage. */
  var drawer   = document.getElementById('drawer');
  var scrim    = document.getElementById('scrim');
  var handle   = document.getElementById('handle');
  var btnTheme = document.getElementById('btn-themeflip');
  var viewer   = document.getElementById('viewer');
  var welcome  = document.getElementById('welcome');
  var heading  = document.getElementById('shell-title');
  var indexTitle = document.title;

  /* Deck map from the drawer's own links (single source: the markup). */
  var decks = {};
  var links = Array.prototype.slice.call(drawer.querySelectorAll('a[data-slug]'));
  links.forEach(function (a) {
    decks[a.getAttribute('data-slug')] = {
      file: a.getAttribute('href'),
      title: a.getAttribute('data-title')
    };
  });

  var frame = null;

  function deckLoaded() { return !viewer.hidden; }
  function drawerOpen() { return document.body.classList.contains('drawer-open'); }

  /* Over a loaded deck the drawer is a modal dialog (scrim + trap + Esc).
     On the bare URL it is plain open content — no dialog role, no scrim. */
  function setDrawer(open, moveFocus) {
    document.body.classList.toggle('drawer-open', open);
    /* inert removes the closed drawer from tab order and the accessibility
       tree immediately (the CSS visibility flip waits for the slide-out). */
    drawer.inert = !open;
    handle.setAttribute('aria-expanded', String(open));
    handle.textContent = open ? 'Close' : 'Index';
    var modal = open && deckLoaded();
    if (modal) {
      drawer.setAttribute('role', 'dialog');
      drawer.setAttribute('aria-modal', 'true');
      scrim.hidden = false;
    } else {
      drawer.removeAttribute('role');
      drawer.removeAttribute('aria-modal');
      scrim.hidden = true;
    }
    /* Modal containment: the deck iframe sits between the toggle and the
       drawer in tab order, so without this a Tab from the toggle would land
       IN the iframe — under the scrim, in content aria-modal tells assistive
       tech to ignore. inert pulls the whole frame out of tab order and the
       a11y tree while the drawer is modal; cleared in every non-modal state
       (index state, or drawer closed) so the deck stays operable. */
    if (frame) frame.inert = modal;
    if (open && moveFocus) drawer.focus();
    if (!open && moveFocus) handle.focus();
  }
  handle.addEventListener('click', function () { setDrawer(!drawerOpen(), true); });
  scrim.addEventListener('click', function () { setDrawer(false, true); });

  function markCurrent(slug) {
    links.forEach(function (a) {
      if (a.getAttribute('data-slug') === slug) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  function showDeck(slug) {
    var deck = decks[slug];
    welcome.hidden = true;
    viewer.hidden = false;
    setDrawer(false, false);
    markCurrent(slug);
    document.title = deck.title;
    if (!frame || frame.getAttribute('data-slug') !== slug) {
      /* Fresh iframe per deck: setting src on an existing iframe would push
         its own entry into the session history and break Back. */
      if (frame) frame.remove();
      frame = document.createElement('iframe');
      frame.setAttribute('title', deck.title);
      frame.setAttribute('data-slug', slug);
      frame.setAttribute('allowfullscreen', '');
      frame.setAttribute('allow', 'fullscreen');
      frame.addEventListener('load', postTheme); /* deck obeys the shell's theme from first paint */
      frame.src = deck.file;
      viewer.appendChild(frame);
    }
    frame.focus(); /* land keyboard/SR users on the deck */
  }

  function showIndex(moveFocus) {
    var wasDeck = deckLoaded();
    viewer.hidden = true;
    welcome.hidden = false;
    if (frame) { frame.remove(); frame = null; }
    markCurrent(null);
    document.title = indexTitle;
    setDrawer(true, false);
    if (moveFocus && wasDeck) heading.focus();
  }

  function route(initial) {
    var slug = location.hash.slice(1);
    if (decks[slug]) showDeck(slug);
    else showIndex(!initial);
  }
  window.addEventListener('hashchange', function () { route(false); });

  /* Deck links: route through the shell's hash. Modified clicks (new tab,
     etc.) keep the default behavior — the href is the standalone deck. */
  links.forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      var slug = a.getAttribute('data-slug');
      if (location.hash === '#' + slug) {
        setDrawer(false, false); /* same deck re-picked: no hashchange fires */
        if (frame) frame.focus();
      } else {
        location.hash = slug;
      }
    });
  });

  /* Esc closes the drawer over a deck; Tab is trapped while it is modal.
     The trap covers everything operable above the scrim, in DOM/tab order:
     the handle (the labeled close affordance — its label reads "Close" while
     open), the theme toggle, then the drawer's nav links. There is no
     in-drawer close button; the handle closes the drawer. */
  document.addEventListener('keydown', function (e) {
    if (!(drawerOpen() && deckLoaded())) return;
    if (e.key === 'Escape') { e.preventDefault(); setDrawer(false, true); return; }
    if (e.key !== 'Tab') return;
    var focusables = [handle, btnTheme].concat(Array.prototype.slice.call(
      drawer.querySelectorAll('a[href], button:not([hidden])')
    )).filter(function (el) { return el.getClientRects().length > 0; });
    if (!focusables.length) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === drawer)) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  });

  /* Dark mode, page-level: stamp data-theme on <html> (the theme CSS has
     both forced blocks) AND post the theme into the deck iframe, where the
     DeckController applies it through the same data-theme path as its own
     toggle. One-way: the deck never replies. The choice persists in
     localStorage (guarded — file:// contexts may deny storage access). */
  var THEME_KEY = 'accessible-slides-theme';
  function readStoredTheme() {
    try { return localStorage.getItem(THEME_KEY); } catch (err) { return null; }
  }
  function storeTheme(value) {
    try { localStorage.setItem(THEME_KEY, value); } catch (err) { /* file:// quirk: no storage */ }
  }
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function isDarkNow() {
    var forced = document.documentElement.getAttribute('data-theme');
    if (forced === 'dark') return true;
    if (forced === 'light') return false;
    return mq.matches;
  }
  function postTheme() {
    /* Only a FORCED theme is posted: with no explicit choice, shell and
       deck both follow prefers-color-scheme on their own and stay in sync.
       targetOrigin is '*' because file:// pages have opaque origins a
       concrete origin can never match; the payload is a theme name only. */
    var forced = document.documentElement.getAttribute('data-theme');
    if (!forced || !frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({type: 'set-theme', theme: forced}, '*');
  }
  var stored = readStoredTheme();
  if (stored === 'dark' || stored === 'light') {
    document.documentElement.setAttribute('data-theme', stored);
  }
  btnTheme.setAttribute('aria-pressed', String(isDarkNow()));
  btnTheme.addEventListener('click', function () {
    var next = isDarkNow() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    btnTheme.setAttribute('aria-pressed', String(next === 'dark'));
    storeTheme(next);
    postTheme();
  });
  mq.addEventListener('change', function () {
    if (!document.documentElement.hasAttribute('data-theme')) {
      btnTheme.setAttribute('aria-pressed', String(mq.matches));
    }
  });

  route(true);
})();
</script>
